<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14213d">
  <title>Omake — Beaux Arts magazine</title>

  <style>
    :root {
      --navy: #14213d;
      --navy-2: #1f3158;
      --ink: #172033;
      --muted: #707887;
      --paper: #fffdf8;
      --cream: #f5f0e8;
      --cream-2: #ece4d8;
      --blue: #355d9d;
      --red: #b84a4a;
      --gold: #b88b4a;
      --line: rgba(20, 33, 61, 0.12);
      --shadow: 0 24px 70px rgba(26, 34, 54, 0.13);
      --radius-lg: 28px;
      --radius-md: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(53, 93, 157, 0.10), transparent 29%),
        radial-gradient(circle at 92% 10%, rgba(184, 74, 74, 0.08), transparent 25%),
        linear-gradient(180deg, #f8f5ef 0%, #efe9df 100%);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
        "Yu Gothic", "YuGothic", "Noto Sans JP", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.24;
      background-image:
        linear-gradient(rgba(20,33,61,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(20,33,61,.025) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, black, transparent 75%);
    }

    button, textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 58px 0 72px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .flag-line {
      display: grid;
      grid-template-columns: repeat(3, 8px);
      gap: 3px;
      height: 32px;
    }

    .flag-line span {
      border-radius: 99px;
    }

    .flag-line span:nth-child(1) { background: #315a9a; }
    .flag-line span:nth-child(2) { background: #faf7f0; border: 1px solid #ded8ce; }
    .flag-line span:nth-child(3) { background: #b64b50; }

    .brand-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--navy);
    }

    .brand-subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.84rem;
      letter-spacing: 0.08em;
    }


    .brand-actions {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 0 0 auto;
    }

    .header-bonus-btn {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(20,33,61,.12);
      border-radius: 999px;
      padding: 0 13px;
      color: var(--navy);
      background: rgba(255,255,255,.58);
      font-family: Georgia, "Times New Roman", serif;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform .15s ease, box-shadow .18s ease, color .18s ease,
                  background .18s ease, border-color .18s ease;
    }

    .header-bonus-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(53,93,157,.28);
      box-shadow: 0 7px 18px rgba(20,33,61,.08);
    }

    .header-bonus-btn.active {
      color: #fff;
      border-color: var(--navy);
      background: linear-gradient(135deg, var(--navy), var(--navy-2));
      box-shadow: 0 8px 20px rgba(20,33,61,.16);
    }

    .count-badge {
      flex: 0 0 auto;
      color: var(--navy);
      background: rgba(255,255,255,.58);
      border: 1px solid rgba(20,33,61,.10);
      border-radius: 999px;
      padding: 8px 13px;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .06em;
      backdrop-filter: blur(8px);
    }

    .shell {
      position: relative;
      overflow: hidden;
      background: rgba(255, 253, 248, 0.92);
      border: 1px solid rgba(255,255,255,.84);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .shell::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #355d9d 0 33.33%, #f8f5ef 33.33% 66.66%, #b84a4a 66.66%);
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) auto;
      gap: 14px;
      align-items: end;
      padding: 28px 30px;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 243, 236, .65);
    }

    .field-label {
      display: block;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .level-group {
      display: grid;
      grid-template-columns: repeat(4, minmax(72px, 1fr));
      gap: 9px;
    }

    .level-option {
      position: relative;
      min-width: 0;
    }

    .level-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .level-option label {
      min-height: 54px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(20, 33, 61, .12);
      border-radius: 14px;
      padding: 8px 12px;
      color: var(--navy);
      background: #fffdf9;
      cursor: pointer;
      user-select: none;
      transition: transform .15s ease, box-shadow .18s ease, background .18s ease,
                  color .18s ease, border-color .18s ease;
    }

    .level-option label:hover {
      transform: translateY(-1px);
      border-color: rgba(53,93,157,.30);
      box-shadow: 0 8px 18px rgba(20,33,61,.08);
    }

    .level-option input:checked + label {
      color: #fff;
      border-color: var(--navy);
      background: linear-gradient(135deg, var(--navy), var(--navy-2));
      box-shadow: 0 9px 22px rgba(20,33,61,.20);
    }

    .level-option input:focus-visible + label {
      outline: 3px solid rgba(53,93,157,.22);
      outline-offset: 2px;
    }

    .level-option strong {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.08rem;
      line-height: 1;
    }

    .level-option span {
      display: block;
      margin-top: 5px;
      font-size: .66rem;
      font-weight: 700;
      opacity: .68;
    }

    .level-option input:checked + label span {
      opacity: .8;
    }

    .primary-btn, .secondary-btn, .ghost-btn {
      border: 0;
      border-radius: 14px;
      min-height: 48px;
      padding: 0 20px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .18s ease, opacity .18s ease, background .18s ease;
    }

    .primary-btn {
      color: #fff;
      background: linear-gradient(135deg, var(--navy), var(--navy-2));
      box-shadow: 0 10px 25px rgba(20, 33, 61, .20);
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 13px 30px rgba(20, 33, 61, .25);
    }

    .secondary-btn {
      width: 100%;
      color: #fff;
      background: linear-gradient(135deg, #315a9a, #496fa9);
      box-shadow: 0 10px 24px rgba(49, 90, 154, .18);
    }

    .ghost-btn {
      width: 100%;
      color: var(--navy);
      background: #f1ece4;
      border: 1px solid rgba(20,33,61,.08);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .42;
      box-shadow: none;
      transform: none;
    }

    .content {
      padding: 34px 30px 32px;
    }

    .empty-state {
      text-align: center;
      padding: 56px 20px 62px;
      color: var(--muted);
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--cream);
      color: var(--navy);
      font-family: Georgia, serif;
      font-size: 1.65rem;
    }

    .empty-state h2 {
      margin: 0 0 8px;
      color: var(--navy);
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: 1.48rem;
    }

    .empty-state p {
      margin: 0;
      font-size: .92rem;
      line-height: 1.75;
    }

    .quiz {
      display: none;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 17px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 27px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .03em;
      background: #eceff5;
      color: var(--navy);
    }

    .pill.level {
      background: var(--navy);
      color: #fff;
    }

    .pill.register {
      background: #efe7db;
      color: #785f38;
    }

    .question-label, .answer-label {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .french {
      margin: 0;
      color: var(--navy);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.55rem, 4.4vw, 2.32rem);
      line-height: 1.5;
      letter-spacing: -0.016em;
      overflow-wrap: anywhere;
    }

    .divider {
      height: 1px;
      margin: 27px 0;
      background: var(--line);
    }

    .translation-box label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--navy);
      font-size: .9rem;
      font-weight: 800;
    }

    .translation-box label span {
      color: var(--muted);
      font-size: .72rem;
      font-weight: 500;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border: 1px solid rgba(20,33,61,.12);
      border-radius: 16px;
      padding: 16px;
      color: var(--ink);
      background: #fbfaf7;
      outline: none;
      line-height: 1.7;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }

    textarea::placeholder {
      color: #a2a7af;
    }

    textarea:focus {
      border-color: rgba(53,93,157,.48);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(53,93,157,.08);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
      margin-top: 14px;
    }

    .answer {
      display: none;
      margin-top: 26px;
      padding: 24px;
      border-radius: var(--radius-md);
      background:
        linear-gradient(145deg, rgba(239,233,223,.74), rgba(255,253,248,.96));
      border: 1px solid rgba(184,139,74,.19);
      animation: reveal .3s ease both;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .answer-jp {
      margin: 0;
      color: var(--ink);
      font-size: 1.05rem;
      line-height: 1.9;
      font-weight: 600;
    }

    .points {
      margin-top: 19px;
      padding-top: 18px;
      border-top: 1px solid rgba(20,33,61,.10);
    }

    .points-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      color: var(--navy);
      font-size: .8rem;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .points-title::before {
      content: "✦";
      color: var(--gold);
    }

    .points ul {
      margin: 0;
      padding-left: 1.25em;
      color: #4f5664;
      font-size: .9rem;
      line-height: 1.8;
    }

    .footer-note {
      margin: 18px 4px 0;
      text-align: center;
      color: #888d96;
      font-size: .72rem;
      line-height: 1.6;
    }

    .kbd {
      display: inline-block;
      padding: 1px 6px;
      border: 1px solid rgba(20,33,61,.11);
      border-bottom-width: 2px;
      border-radius: 5px;
      background: rgba(255,255,255,.6);
      color: #737986;
      font-size: .68rem;
      vertical-align: 1px;
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 20px, 920px);
        padding: 30px 0 48px;
      }

      .brand {
        align-items: flex-end;
      }

      .count-badge {
        display: none;
      }

      .brand-actions {
        gap: 0;
      }

      .header-bonus-btn {
        min-height: 32px;
        padding: 0 12px;
        font-size: .78rem;
      }

      .toolbar {
        grid-template-columns: 1fr;
        padding: 22px 20px;
      }

      .toolbar .primary-btn {
        width: 100%;
      }

      .level-group {
        gap: 7px;
      }

      .level-option label {
        min-width: 0;
        padding: 8px 5px;
      }

      .level-option strong {
        font-size: 1rem;
      }

      .level-option span {
        font-size: .61rem;
      }

      .content {
        padding: 28px 20px 24px;
      }

      .empty-state {
        padding: 42px 12px 48px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .answer {
        padding: 20px;
      }

      .french {
        line-height: 1.48;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }

    .omake-shell {
      padding: 28px 30px 30px;
      min-height: 560px;
    }

    .omake-header {
      margin-bottom: 20px;
    }

    .omake-kicker {
      display: inline-block;
      margin-bottom: 6px;
      color: var(--blue);
      font-size: .7rem;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .omake-title {
      margin: 0;
      color: var(--navy);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.45rem, 4vw, 1.9rem);
      font-weight: 500;
      letter-spacing: -.02em;
    }

    .omake-description {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.7;
    }

    .x-timeline-wrap {
      min-height: 500px;
      overflow: hidden;
      border: 1px solid rgba(20,33,61,.10);
      border-radius: 18px;
      background: #fff;
    }

    .x-timeline-wrap .twitter-timeline {
      display: block;
      width: 100%;
      min-height: 500px;
    }

    .omake-fallback {
      margin: 12px 2px 0;
      color: var(--muted);
      font-size: .74rem;
      line-height: 1.65;
    }

    .omake-fallback a {
      color: var(--blue);
      font-weight: 700;
      text-decoration: none;
    }

    .omake-fallback a:hover {
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .omake-shell {
        min-height: 500px;
        padding: 22px 20px 24px;
      }

      .x-timeline-wrap,
      .x-timeline-wrap .twitter-timeline {
        min-height: 430px;
      }
    }

  </style>
</head>

<body>
  <main class="page">
    <header class="brand">
      <div class="brand-mark">
        <div class="flag-line" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div>
          <h1 class="brand-title">Traduire.</h1>
          <p class="brand-subtitle">FRENCH → JAPANESE TRANSLATION PRACTICE</p>
        </div>
      </div>

      <div class="brand-actions">
        <a class="header-bonus-btn active" href="index.html" title="練習画面に戻る">omake</a>
        <div class="count-badge">A2 — C1 · takusan questions</div>
      </div>
    </header>

    <section class="shell">
      <div class="omake-shell">
        <div class="omake-header">
          <span class="omake-kicker">OMAKE</span>
          <h2 class="omake-title">Beaux Arts magazine</h2>
          <p class="omake-description">@BeauxArts_mag の公開ポストを表示します。</p>
        </div>

        <div class="x-timeline-wrap">
          <a class="twitter-timeline"
             data-height="680"
             href="https://x.com/BeauxArts_mag?ref_src=twsrc%5Etfw">Posts by BeauxArts_mag</a>
        </div>

        <p class="omake-fallback">
          タイムラインが表示されない場合は
          <a href="https://x.com/BeauxArts_mag" target="_blank" rel="noopener noreferrer">@BeauxArts_mag をXで開く</a>
        </p>
      </div>
    </section>

    <p class="footer-note">
      <a href="index.html" style="color:inherit;text-decoration:none;">← 和訳トレーニングに戻る</a>
    </p>
  </main>

  <script async src="https://platform.x.com/widgets.js" charset="utf-8"></script>
</body>
</html>
